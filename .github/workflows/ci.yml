name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable && rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pulseaudio pulseaudio-utils sox
      - run: rustup update stable && rustup component add clippy
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Capture from a real PulseAudio monitor
        run: |
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci
          sox -q -n -t raw -r 48000 -e signed -b 16 -c 2 - synth 30 sine 440 \
            | pacat --device=ci --format=s16le --rate=48000 --channels=2 &
          sleep 1
          cargo test --locked -- --ignored pulse_monitor_capture
