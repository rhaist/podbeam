[package]
name = "podbeam"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Stream your PC's audio to a HomePod over AirPlay 2 (Windows tray app, Linux with PulseAudio/PipeWire)"
license = "MIT OR Apache-2.0"
authors = ["Robert Haist <rhaist@mailbox.org>"]
repository = "https://github.com/rhaist/podbeam"
readme = "README.md"
keywords = ["airplay", "homepod", "audio", "windows", "linux"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
chacha20poly1305 = "0.11.0"
cpal = "0.18"
getrandom = "0.4.3"
hkdf = "0.13.0"
mdns-sd = "0.21"
num-bigint = "0.5.1"
plist = "1.10.3"
sha2 = "0.11.1"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] } # PulseAudio/PipeWire monitor capture
futures = { version = "0.3", default-features = false, features = ["executor"] }
pulseaudio = "0.3" # default sink volume, for the volume keys

[target."cfg(windows)".dependencies]
tray-icon = { version = "0.26.1", default-features = false } # GTK backend is Linux-only and unused
windows = { version = "0.62", features = ["Win32_Media_Audio_Endpoints", "Win32_System_Com"] } # system volume
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Foundation"] }

[profile.release]
lto = "thin"
strip = true
